spring:
  application:
    name: studentlifejava
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  admin:
    username: ${ADMIN_USERNAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate        # Hibernate checks schema matches entities, never touches DDL
      show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jwt:
    secret: ${JWT_SECRET}
    access-token-expire: ${JWT_ACCESS_TOKEN_EXPIRE}
    refresh-token-expire: ${JWT_REFRESH_TOKEN_EXPIRE}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      # password: your_secure_password # Uncomment if your Redis instance requires authentication
      timeout: 2000ms # Connection timeout configuration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 5000
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    otp:
      validity-minutes: 5
